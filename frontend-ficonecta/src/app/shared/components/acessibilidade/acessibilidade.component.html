<section class="acessibilidade" aria-label="Opções da conta e acessibilidade">
  @if (authService.sessaoAtiva()) {
    <button type="button" class="acessibilidade__sair" (click)="sair()" aria-label="Sair da conta" title="Sair">
      <span aria-hidden="true">↪</span>
    </button>
  }

  <button
    type="button"
    class="acessibilidade__gatilho"
    (click)="alternarMenu()"
    [attr.aria-expanded]="menuAberto()"
    aria-controls="menu-acessibilidade"
    aria-label="Opções de acessibilidade"
    title="Acessibilidade">
    <svg class="acessibilidade__icone" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <circle cx="32" cy="9" r="6" fill="currentColor" />
      <path d="M8 22h48a3 3 0 1 1 0 6H38v8.5l13.5 17.8a3 3 0 1 1-4.8 3.6L32 38.5 17.3 57.9a3 3 0 0 1-4.8-3.6L26 36.5V28H8a3 3 0 1 1 0-6Z" fill="currentColor" />
    </svg>
  </button>

  @if (menuAberto()) {
    <div id="menu-acessibilidade" class="acessibilidade__menu">
      <div class="acessibilidade__acoes-fonte">
        <button type="button" (click)="acessibilidade.diminuirFonte()" aria-label="Diminuir tamanho da fonte" title="Diminuir fonte">A−</button>
        <button type="button" (click)="acessibilidade.aumentarFonte()" aria-label="Aumentar tamanho da fonte" title="Aumentar fonte">A+</button>
      </div>
      <button
        type="button"
        class="acessibilidade__tema"
        (click)="acessibilidade.alternarTema()"
        [attr.aria-pressed]="acessibilidade.tema() === 'escuro'"
        [attr.aria-label]="acessibilidade.tema() === 'claro' ? 'Ativar modo escuro' : 'Ativar modo claro'"
        [title]="acessibilidade.tema() === 'claro' ? 'Ativar modo escuro' : 'Ativar modo claro'">
        <span aria-hidden="true">{{ acessibilidade.tema() === 'claro' ? '☾' : '☀' }}</span>
      </button>
    </div>
  }
</section>
