<main class="vaga-page">
  <header class="vaga-page__header">
    <a routerLink="/empresa/dashboard">← Voltar ao painel</a>
    <span>FI Conecta</span>
  </header>

  <section class="vaga-card">
    <p class="vaga-card__eyebrow">Empresa</p>
    <h1>Cadastre uma vaga</h1>
    <p class="vaga-card__intro">Informe os detalhes da oportunidade e do local de trabalho.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <fieldset>
        <legend>Sobre a vaga</legend>
        <div class="vaga-form__grid">
          <label class="vaga-form__field vaga-form__field--full">Título
            <input formControlName="titulo" maxlength="150" />
            @if (form.controls.titulo.touched && form.controls.titulo.invalid) { <small>Informe o título da vaga.</small> }
          </label>
          <label class="vaga-form__field vaga-form__field--full">Descrição
            <textarea formControlName="descricao" rows="4"></textarea>
          </label>
          <label class="vaga-form__field">Valor (R$)
            <input formControlName="valor" type="number" min="0.01" step="0.01" />
            @if (form.controls.valor.touched && form.controls.valor.invalid) { <small>Informe um valor maior que zero.</small> }
          </label>
          <label class="vaga-form__field">Data
            <input formControlName="dataVaga" type="date" [min]="hoje" />
            @if (form.controls.dataVaga.touched && form.controls.dataVaga.invalid) { <small>Informe a data da vaga.</small> }
          </label>
          <label class="vaga-form__field">Início
            <input formControlName="horarioInicio" type="time" />
          </label>
          <label class="vaga-form__field">Término
            <input formControlName="horarioFim" type="time" />
          </label>
        </div>
      </fieldset>

      <fieldset formGroupName="endereco">
        <legend>Local de trabalho</legend>
        <div class="vaga-form__grid">
          <label class="vaga-form__field">CEP<input formControlName="cep" inputmode="numeric" maxlength="8" />@if (form.controls.endereco.controls.cep.touched && form.controls.endereco.controls.cep.invalid) { <small>Use os 8 dígitos do CEP.</small> }</label>
          <label class="vaga-form__field vaga-form__field--wide">Logradouro<input formControlName="logradouro" /></label>
          <label class="vaga-form__field">Número<input formControlName="numero" /></label>
          <label class="vaga-form__field">Complemento<input formControlName="complemento" /></label>
          <label class="vaga-form__field">Bairro<input formControlName="bairro" /></label>
          <label class="vaga-form__field">Cidade<input formControlName="cidade" /></label>
          <label class="vaga-form__field">UF<input formControlName="uf" maxlength="2" placeholder="CE" style="text-transform: uppercase" /></label>
        </div>
      </fieldset>

      @if (erro()) { <p class="vaga-form__message vaga-form__message--error">{{ erro() }}</p> }
      @if (sucesso()) { <p class="vaga-form__message vaga-form__message--success">Vaga cadastrada! Redirecionando...</p> }
      <div class="vaga-form__actions">
        <a routerLink="/empresa/dashboard">Cancelar</a>
        <button type="submit" [disabled]="carregando() || sucesso()">{{ carregando() ? 'Publicando...' : 'Publicar vaga' }}</button>
      </div>
    </form>
  </section>
</main>
